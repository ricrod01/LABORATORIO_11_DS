# Configuración del pipeline del Laboratorio 11.
# Basada en el alcance documentado en LABORATORIO_11.pdf.

datos:
  ruta: "datos/Datos_INGUAT.csv"
  columnas:
    anio: "Año"
    mes: "Mes cod"
    via: "Vía"
    pais: "País"
    tipo_viajero: "Tipo de Viajero"
    viajeros: "Viajero"
  granularidad: "mensual"
  unidad: "personas"
  tipos_viajero: ["Turista", "excursionista"]  # Comparar normalizando mayúsculas y acentos.

particion:
  entrenamiento: 0.70
  validacion: 0.30
  criterio: "primeros_meses_con_datos"
  respetar_orden_temporal: true
  dividir_por: "meses_unicos"  # No dividir por número de filas.
  meses_sin_cobertura: "no_rellenar_con_cero"

modelado:
  candidatos: ["sarima", "prophet", "holt_winters", "suavizamiento_simple"]
  seleccion: "menor_error_en_validacion"
  reentrenar_ganador_con_todos_los_datos: true
  sarima:
    p: [0, 1, 2, 3]
    d: [0, 1, 2]
    q: [0, 1, 2, 3]
    P: [0, 1, 2, 3]
    D: [0, 1, 2]
    Q: [0, 1, 2, 3]
    periodo_estacional: 12  # Propuesta por la periodicidad mensual.
  holt_winters:
    trend: "add"
    seasonal: "add"
    seasonal_periods: 12  # Propuesta por la periodicidad mensual.
  prophet: {}  # Hiperparámetros aún no definidos en el informe.
  suavizamiento_simple: {}  # Hiperparámetros aún no definidos en el informe.

evaluacion:
  metricas: ["MAE", "RMSE"]  # Propuesta; el informe no fija una métrica.
  referencia: "ultimo_valor_observado"  # Propuesta para el comparador sencillo.
  umbral_aceptacion: null  # Pendiente de definir y justificar.
  rechazar_ante_fallo_critico: true

pronostico:
  horizonte_meses: 24

factor_reparto:
  formula: "estimacion * porcentaje_ocupacion"
  porcentajes_ocupacion: null  # No se especifican valores en el informe.

salidas:
  carpeta_modelos: "modelos"
  archivos:
    aereo: "modelo_aereo.joblib"
    maritimo: "modelo_maritimo.joblib"
    terrestre: "modelo_terrestre.joblib"

reproducibilidad:
  semilla: 42  # Valor propuesto para operaciones aleatorias, si las hay.
